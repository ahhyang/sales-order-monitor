name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SALES_API_KEY: ci-placeholder

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    env:
      SALES_API_KEY: ${{ secrets.SALES_API_KEY }}
    steps:
      - name: Check for API key secret
        id: key
        run: |
          if [ -n "$SALES_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::SALES_API_KEY repository secret is not set; skipping end-to-end tests."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.present == 'true'
        run: npm ci
      - if: steps.key.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.key.outputs.present == 'true'
        run: npm run build
      - if: steps.key.outputs.present == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
